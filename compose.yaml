services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: requestdesk
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d requestdesk"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "8082:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/requestdesk
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DEMO_AGENT_EMAIL: ${DEMO_AGENT_EMAIL:-agent@example.com}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:?Set DEMO_AGENT_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_data:
